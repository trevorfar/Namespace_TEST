name: benchmark

on:
  push:
  workflow_dispatch:

# The github and namespace jobs cache the fully installed virtualenv (~1.5 GB),
# so a warm run skips installing packages. The difference is where that cache
# lives: GitHub downloads and unpacks it on every run, while Namespace keeps it
# on a cache volume that is already attached to the runner.
#
# Namespace runners pin github.run-id so a spare runner left over from an
# earlier run (with an older cache fork) can't pick up this run's jobs.
jobs:
  # Baseline: GitHub's standard runner with actions/cache.
  github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('requirements-ci.txt') }}
      - name: Install dependencies
        run: |
          [ -x ~/.venv/bin/python ] || python -m venv ~/.venv
          ~/.venv/bin/pip install -r requirements-ci.txt
      - run: ~/.venv/bin/pytest -v

  # Same work on a Namespace runner. Requires a cache volume on the profile.
  namespace:
    runs-on: namespace-profile-benchmark;github.run-id=${{ github.run_id }}
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: ~/.venv
      - name: Install dependencies
        run: |
          [ -x ~/.venv/bin/python ] || python -m venv ~/.venv
          ~/.venv/bin/pip install -r requirements-ci.txt
      - run: ~/.venv/bin/pytest -v
